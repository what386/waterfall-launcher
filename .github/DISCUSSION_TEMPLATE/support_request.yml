title: "Support / Help"
labels:
  - support
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out! Please provide as much detail as possible so we can help you quickly.

  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Clearly describe your question or problem.
      placeholder: |
        I'm trying to...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to achieve?
      placeholder: |
        I'm working on...
    validations:
      required: false

  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Steps you've already taken to solve the issue.
      placeholder: |
        I tried...
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Paste relevant logcat output, screenshots, launcher settings, or reproduction notes.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Waterfall Launcher version
      description: Version name and version code from Android app info, the APK, or F-Droid.
      placeholder: 1.5.0 (6)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: Device model, Android version, ROM/OEM skin, and whether Waterfall is the default home app.
      placeholder: Pixel 8, Android 15, Waterfall set as default home.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before posting
      options:
        - label: I searched existing discussions and issues.
          required: true
        - label: I read the README and checked Android default home app settings.
          required: true
